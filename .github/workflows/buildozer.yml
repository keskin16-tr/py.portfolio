name: Build Android APK with Buildozer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip acl autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev \
          libsqlite3-dev libssl-dev libffi-dev liblzma-dev libbz2-dev \
          openjdk-21-jdk ant ccache

    - name: Set JAVA_HOME Environment Variable
      run: echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV

    - name: Install Cython and Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Cache Buildozer global directory
      uses: actions/cache@v5
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n83316d6896241ef954355f34f4bbf4d7bfa5468d" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n24333f8a53b68062b08510488e8430a7243301b5" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n284e4302fcba52cc0417bac7a331a624f4e705b7" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload Generated APK
      uses: actions/upload-artifact@v5
      with:
        name: flask-android-app
        path: bin/*.apk
